[package]
name = "cap-llm-config"
version = "0.1.0"
edition = "2021"
description = "z-biz-tool 家族统一的 LLM 配置存储：单一落点、OS 密钥库密钥、旧配置迁移"
license = "MIT"
repository = "https://github.com/z-biz-tool/z-biz-tool-capability"
homepage = "https://github.com/z-biz-tool/z-biz-tool-capability"
# crates.io 硬限制：keywords 最多 5 个。
keywords = ["llm", "config", "keychain", "z-biz", "tauri"]
categories = ["api-bindings", "config"]

# 允许发布到 crates.io 官方源（对外只发源码，不含任何密钥与内部数据）。
publish = ["crates-io"]
[features]
# Tauri 胶水层。
#
# **默认关闭**：核心能力（路径解析、配置读写、迁移判定）是纯 IO，
# 零 tauri 依赖 —— 这样它能被 node 测试、CLI 工具、非 Tauri 宿主直接复用。
# Tauri 应用打开这个 feature。
default = []
tauri = ["dep:tauri"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# OS 密钥库：macOS Keychain / Windows Credential Manager / Linux Secret Service。
# 与 cap-sso 用同一个 crate（4.2.0），跨平台行为一致。
#
# ⚠️ **macOS 上不用它**（见 src/encrypted_file.rs 的模块文档）：
# 钥匙串 ACL 绑「创建者的代码签名」，而我们是 adhoc 签名 ⇒ 每次重打包都弹
# 「wants to use your confidential information」。Windows / Linux 仍然走它 ——
# 那两个平台的凭据管理器 / Secret Service 没有这个签名绑定问题。
keyring = "4.2.0"
# macOS 后端的静态加密（见 src/encrypted_file.rs）。
aes-gcm = { workspace = true }
getrandom = { workspace = true }
data-encoding = { workspace = true }
tauri = { version = "2", optional = true }
# 供应商预设目录：迁移时按旧地址反查厂商（db 仓旧配置没有 provider 字段）。
# version 必填：cargo package 要求所有依赖带版本号（发布时 path 被自动剥离，
# 依赖解析回落到 crates.io 的 cap-llm）。本地开发仍走 path，改动即时可见。
cap-llm = { path = "../cap-llm", version = "0.1.0" }
