[workspace]
resolver = "2"
members = ["crates/*"]

# 全家族的 Rust 依赖版本在此统一（矩阵规划 03 §4.2）：
# reqwest 0.12×6 仓 vs 0.13×1 仓、tokio features 各写各的这类分裂不再重演
[workspace.dependencies]
image = "0.25"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cap-doc（GAP-06 补齐：文档解析原语）——版本与 z-biz-tool-file/src-tauri 保持一致，
# 搬迁期间两边可以字节级对账；file 接入后由本表作为唯一版本源。
lopdf = { version = "0.34", features = ["pom_parser"] }
zip = { version = "9", features = ["deflate64", "lzma", "xz"] }
flate2 = "1"
# 中文电子书（TXT 小说、GBK 编码的 MOBI）必须做真实编码转换：
# MOBI 的 text_encoding 常见 65001(UTF-8) / 1252(cp1252) / 936(GBK)，
# 而 TXT 小说在国内绝大多数是 GB18030。没有这层就只能输出替换字符。
encoding_rs = "0.8"

# cap-llm（统一 AI 接入层）—— 上面那句「reqwest 分裂不再重演」写在这里很久了，
# 但 workspace.dependencies 里一直没有 reqwest，所以分裂一直在。本表从此刻起是唯一版本源：
#
#   reqwest 0.12（aigen/file/kb/note/pet/db/box）× 0.13（worker 一家）
#   TLS：rustls-tls（aigen/file）vs 默认 native-tls（其余）—— 两套 TLS 后端会被同时编进去
#
# 统一到 0.12 + rustls-tls：不依赖系统 OpenSSL（Linux 上不用装 libssl-dev），
# 且三平台证书行为一致。worker 迁过来时它的 0.13 也一并收回。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    # ASR（Action::Transcription）要传音频文件，走 multipart/form-data。
    # 显式开：本 workspace 一律 default-features = false，不开就是编译期错误，
    # 而不是运行时 422 —— 这里宁可编译期挡下。
    "multipart",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

# 凭证静态加密（cap-llm-config 的 macOS 后端，见该 crate 的 src/encrypted_file.rs）：
#
# **为什么 macOS 不用 OS 钥匙串**：钥匙串条目的 ACL 把「创建者的代码签名」记为
# 唯一可信应用。我们这些 app 是 **adhoc 签名**，其 designated requirement 就是
# cdhash（`codesign -d -r-` 实测：`designated => cdhash H"..."`）⇒ 每次重新打包
# cdhash 就变 ⇒ 钥匙串认为是个新应用 ⇒ **每次启动都弹**
# 「z-biz-tool-file wants to use your confidential information stored in z-biz-tool」。
#
# 实测过但走不通的替代方案（都写在 cap-llm-config 的 encrypted_file 模块文档里，
# 那里有完整的实验方法与判据，别再走一遍）：
#   - kSecUseDataProtectionKeychain：-34018（缺 entitlement，未签名 app 用不了）
#   - all-apps ACL（SecAccessCreate + SecACLSetContents）：只对当前进程有效，
#     换个 cdhash 的二进制读同一条目仍阻塞 ⇒ 治不了「每次重打包」
#   - security add-generic-password -A：同上，换二进制读照样阻塞
#   - 按路径信任（SecTrustedApplicationCreateFromPath）：同路径但字节不同 ⇒ 仍弹
#   - 正式签名证书：本机 `security find-identity` = 0 个可用身份
#
# 版本与 z-biz-tool-file/src-tauri（terminal 板块自建的那套）保持一致，
# 存储格式也刻意对齐 `enc:v1:`，两边的密文能互相读。
aes-gcm = "0.10"
getrandom = "0.2"
data-encoding = "2"

[profile.release]
debug = false
incremental = false
strip = "symbols"
